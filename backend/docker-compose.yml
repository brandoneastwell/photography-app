services:
  db:
    image: postgis/postgis:17-3.5
    platform: linux/amd64
    container_name: photoapp-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: photoapp
      POSTGRES_USER: photoapp_user
      POSTGRES_PASSWORD: password

    ports:
      - "5432:5432"

    volumes:
      - photoapp_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photoapp_user -d photoapp"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  photoapp_postgres_data: